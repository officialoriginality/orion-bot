<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orion</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="./favicon.ico" type="image/x-icon">

<style>
  :root {
    --blue: #4f7cff;
    --blue-light: #7ea2ff;
    --bg: #05070c;
    --card: #0d121d;
    --border: #1b2638;
    --border-light: #26344d;
    --text: #f5f7fb;
    --muted: #8d99aa;
    --white: #ffffff;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      Helvetica, Arial, sans-serif;

    color: var(--text);

    background:
      radial-gradient(
        circle at 50% -10%,
        rgba(79, 124, 255, 0.15),
        transparent 42%
      ),
      linear-gradient(
        145deg,
        #05070c 0%,
        #080c14 50%,
        #05070c 100%
      );
  }

  .card {
    width: 100%;
    max-width: 520px;
    padding: 44px 36px;

    text-align: center;

    background: rgba(13, 18, 29, 0.97);
    border: 1px solid var(--border);
    border-radius: 18px;

    box-shadow:
      0 24px 70px rgba(0, 0, 0, 0.45);
  }

  .logo {
    width: 64px;
    height: 64px;

    margin: 0 auto 20px;

    display: block;

    object-fit: contain;

    border-radius: 16px;

    box-shadow:
      0 10px 28px rgba(79, 124, 255, 0.16);
  }

  h1 {
    margin: 0 0 8px;

    color: var(--white);
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.03em;
  }

  .subtitle {
    margin: 0 0 30px;

    color: var(--muted);
    font-size: 1rem;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .links a {
    display: block;

    padding: 14px 18px;

    background: #0a101c;
    border: 1px solid var(--border-light);
    border-radius: 10px;

    color: #b9c7e8;

    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;

    transition:
      background 0.2s ease,
      border-color 0.2s ease,
      color 0.2s ease,
      transform 0.2s ease;
  }

  .links a:hover {
    background: #111c32;
    border-color: #3b5fae;
    color: var(--white);

    transform: translateY(-2px);
  }

  .footer {
    margin-top: 26px;

    color: #5f6b7c;
    font-size: 0.82rem;
  }

  @media (max-width: 600px) {
    body {
      padding: 18px 12px;
    }

    .card {
      padding: 36px 22px;
      border-radius: 16px;
    }

    h1 {
      font-size: 1.8rem;
    }
  }
</style>
</head>

<body>

<main class="card">

  <img
    src="./favicon.ico"
    alt="Orion Logo"
    class="logo"
  >

  <h1>Orion</h1>

  <p class="subtitle">
    Moderation tools for your Discord server.
  </p>

  <div class="links">
    <a href="./documentation.html">Documentation</a>
    <a href="./privacy.html">Privacy Policy</a>
    <a href="./terms.html">Terms of Service</a>
  </div>

  <div class="footer">
    © 2026 Orion
  </div>

</main>

</body>
</html>
