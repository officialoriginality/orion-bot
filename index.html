<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orion</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="./favicon.ico" type="image/x-icon">

<style>
  :root {
    --blue: #5865f2;
    --blue-light: #7289da;
    --blue-soft: #eef2ff;
    --navy: #111827;
    --text: #172033;
    --muted: #64748b;
    --white: #ffffff;
    --border: #dbe3f0;
    --background: #f5f8ff;
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      Helvetica, Arial, sans-serif;
    color: var(--text);

    background:
      radial-gradient(
        circle at top left,
        rgba(88, 101, 242, 0.22),
        transparent 34%
      ),
      radial-gradient(
        circle at bottom right,
        rgba(114, 137, 218, 0.20),
        transparent 35%
      ),
      linear-gradient(
        135deg,
        #eef3ff 0%,
        #f8fbff 48%,
        #e9efff 100%
      );
  }

  .site {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .navbar {
    width: 100%;
    padding: 18px 28px;
    background: rgba(255, 255, 255, 0.88);
    border-bottom: 1px solid rgba(219, 227, 240, 0.9);
    backdrop-filter: blur(10px);
  }

  .nav-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    color: var(--navy);
    font-size: 1.05rem;
    font-weight: 800;
    text-decoration: none;
  }

  .brand img {
    width: 38px;
    height: 38px;
    object-fit: contain;
    border-radius: 10px;
  }

  .navigation {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 7px;
  }

  .navigation a {
    padding: 9px 13px;
    border-radius: 9px;
    color: #526078;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    transition: 0.2s ease;
  }

  .navigation a:hover {
    background: var(--blue-soft);
    color: var(--blue);
  }

  .main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
  }

  .card {
    width: 100%;
    max-width: 560px;
    padding: 50px 42px;
    text-align: center;

    background: rgba(255, 255, 255, 0.94);
    border: 1px solid var(--border);
    border-radius: 24px;

    box-shadow:
      0 18px 50px rgba(47, 73, 130, 0.12);
  }

  .logo {
    width: 94px;
    height: 94px;
    margin: 0 auto 22px;
    object-fit: contain;
    border-radius: 22px;
  }

  h1 {
    margin: 0 0 10px;
    color: var(--navy);
    font-size: 2.35rem;
    letter-spacing: -0.03em;
  }

  .subtitle {
    max-width: 400px;
    margin: 0 auto 34px;
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.6;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .links a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 18px;

    background: #f7f9ff;
    border: 1px solid var(--border);
    border-radius: 11px;

    color: var(--navy);
    font-size: 0.98rem;
    font-weight: 700;
    text-decoration: none;

    transition: 0.2s ease;
  }

  .links a span {
    color: var(--blue);
    font-size: 1.1rem;
  }

  .links a:hover {
    background: var(--blue);
    border-color: var(--blue);
    color: var(--white);
    transform: translateY(-1px);
  }

  .links a:hover span {
    color: var(--white);
  }

  .footer {
    padding: 20px;
    text-align: center;
    color: #7b879b;
    font-size: 0.84rem;
  }

  @media (max-width: 760px) {
    .navbar {
      padding: 14px 16px;
    }

    .nav-inner {
      flex-direction: column;
    }

    .navigation {
      justify-content: center;
    }

    .main {
      padding: 35px 14px;
    }

    .card {
      padding: 40px 24px;
      border-radius: 18px;
    }

    h1 {
      font-size: 2rem;
    }
  }
</style>
</head>

<body>

<div class="site">

  <header class="navbar">
    <div class="nav-inner">

      <a class="brand" href="./index.html">
        <img src="./orion.png" alt="Orion">
        <span>Orion</span>
      </a>

      <nav class="navigation">
        <a href="./index.html">← Back to Orion</a>
        <a href="./documentation.html">Documentation</a>
        <a href="./privacy.html">Privacy Policy</a>
        <a href="./terms.html">Terms of Service</a>
      </nav>

    </div>
  </header>

  <main class="main">

    <section class="card">

      <img class="logo" src="./orion.png" alt="Orion logo">

      <h1>Orion</h1>

      <p class="subtitle">
        Moderation tools for your Discord server.
      </p>

      <div class="links">

        <a href="./documentation.html">
          <span>Documentation</span>
          <span>→</span>
        </a>

        <a href="./privacy.html">
          <span>Privacy Policy</span>
          <span>→</span>
        </a>

        <a href="./terms.html">
          <span>Terms of Service</span>
          <span>→</span>
        </a>

      </div>

    </section>

  </main>

  <footer class="footer">
    © 2026 Orion
  </footer>

</div>

</body>
</html>
