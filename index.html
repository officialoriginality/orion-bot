<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Orion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="./favicon.ico" type="image/x-icon">

  <style>
    :root {
      --blue: #3156d9;
      --blue-dark: #2445b8;
      --blue-light: #4b6be3;
      --blue-soft: #eef2ff;

      --background: #f4f7ff;
      --background-2: #eaf0ff;

      --white: #ffffff;
      --text: #101a35;
      --text-light: #53617f;
      --border: #d8e0f4;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Helvetica, Arial, sans-serif;
      color: var(--text);

      background:
        radial-gradient(
          circle at top left,
          rgba(49, 86, 217, 0.16),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(75, 107, 227, 0.12),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          var(--background) 0%,
          var(--background-2) 100%
        );
    }

    /* =========================
       NAVIGATION
       ========================= */

    .site-header {
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid var(--border);
    }

    .navigation {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      color: var(--text);
      font-size: 1.05rem;
      font-weight: 800;
      text-decoration: none;
    }

    .brand img {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-links a {
      padding: 9px 14px;
      border-radius: 8px;

      color: #405073;
      font-size: 0.9rem;
      font-weight: 650;
      text-decoration: none;

      transition: 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--blue);
      background: var(--blue-soft);
    }

    /* =========================
       MAIN
       ========================= */

    .page {
      min-height: calc(100vh - 63px);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 70px 20px;
    }

    .card {
      width: 100%;
      max-width: 560px;

      padding: 56px 48px;

      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 22px;

      text-align: center;

      box-shadow:
        0 24px 60px rgba(35, 62, 125, 0.10);
    }

    .logo {
      width: 92px;
      height: 92px;

      margin: 0 auto 24px;

      object-fit: contain;
    }

    h1 {
      margin: 0 0 10px;

      color: var(--text);
      font-size: 2.35rem;
      font-weight: 800;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin: 0 0 34px;

      color: var(--text-light);
      font-size: 1.05rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 15px 18px;

      background: var(--blue);
      border: 1px solid var(--blue);
      border-radius: 10px;

      color: var(--white);
      font-size: 0.98rem;
      font-weight: 700;
      text-align: left;
      text-decoration: none;

      transition: 0.2s ease;
    }

    .links a span {
      opacity: 0.9;
      font-size: 1.05rem;
    }

    .links a:hover {
      background: var(--blue-dark);
      border-color: var(--blue-dark);
      transform: translateY(-2px);

      box-shadow:
        0 8px 20px rgba(49, 86, 217, 0.22);
    }

    .footer {
      margin-top: 30px;

      color: #7180a0;
      font-size: 0.82rem;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {
      .navigation {
        padding: 12px 16px;
        flex-direction: column;
        gap: 8px;
      }

      .nav-links {
        flex-wrap: wrap;
        justify-content: center;
      }

      .page {
        min-height: calc(100vh - 105px);
        padding: 35px 14px;
      }

      .card {
        padding: 42px 24px;
        border-radius: 18px;
      }

      .logo {
        width: 78px;
        height: 78px;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <nav class="navigation">

      <a class="brand" href="./index.html">
        <img src="./orion.png" alt="Orion">
        <span>Orion</span>
      </a>

      <div class="nav-links">
        <a href="./documentation.html">Documentation</a>
        <a href="./privacy.html">Privacy Policy</a>
        <a href="./terms.html">Terms of Service</a>
      </div>

    </nav>
  </header>

  <main class="page">

    <section class="card">

      <img
        class="logo"
        src="./orion.png"
        alt="Orion logo"
      >

      <h1>Orion</h1>

      <p class="subtitle">
        Moderation tools for your Discord server.
      </p>

      <div class="links">
        <a href="./documentation.html">
          <span>Documentation</span>
          <span>→</span>
        </a>

        <a href="./privacy.html">
          <span>Privacy Policy</span>
          <span>→</span>
        </a>

        <a href="./terms.html">
          <span>Terms of Service</span>
          <span>→</span>
        </a>
      </div>

      <div class="footer">
        © 2026 Orion
      </div>

    </section>

  </main>

</body>
</html>
