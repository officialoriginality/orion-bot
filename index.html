<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orion Bot — Legal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root {
    --blue: #5865f2;
    --blue-dark: #4752c4;
    --blue-light: #7289da;
    --bg: #080b14;
    --bg-light: #0d1220;
    --card: #111827;
    --card-light: #151d2e;
    --border: #202b44;
    --text: #f1f5f9;
    --muted: #9ca3af;
    --white: #ffffff;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      Helvetica, Arial, sans-serif;
    color: var(--text);

    background:
      radial-gradient(
        circle at top,
        rgba(88, 101, 242, 0.16),
        transparent 40%
      ),
      linear-gradient(
        135deg,
        #080b14 0%,
        #0b1020 50%,
        #070a12 100%
      );
  }

  .card {
    width: 100%;
    max-width: 520px;
    padding: 48px 36px;
    text-align: center;

    background: rgba(17, 24, 39, 0.94);
    border: 1px solid var(--border);
    border-radius: 20px;

    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.45),
      0 0 40px rgba(88, 101, 242, 0.06);
  }

  .logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 18px;
    background: var(--blue);
    color: var(--white);

    font-size: 1.7rem;
    font-weight: 700;

    box-shadow:
      0 8px 25px rgba(88, 101, 242, 0.35);
  }

  h1 {
    margin: 0 0 8px;
    font-size: 2rem;
    color: var(--white);
    letter-spacing: -0.02em;
  }

  .subtitle {
    margin: 0 0 30px;
    color: var(--muted);
    font-size: 1rem;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  a {
    display: block;
    padding: 14px 18px;

    border-radius: 10px;
    background: #18213a;
    border: 1px solid #273452;

    color: #aab5ff;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;

    transition: 0.2s ease;
  }

  a:hover {
    background: var(--blue);
    border-color: var(--blue);
    color: var(--white);

    transform: translateY(-2px);

    box-shadow:
      0 8px 20px rgba(88, 101, 242, 0.3);
  }

  .footer {
    margin-top: 28px;
    font-size: 0.85rem;
    color: #64748b;
  }

  @media (max-width: 600px) {
    body {
      padding: 20px 12px;
    }

    .card {
      padding: 38px 24px;
      border-radius: 16px;
    }

    h1 {
      font-size: 1.8rem;
    }
  }
</style>

</head>

<body>

<main class="card">

  <div class="logo">O</div>

  <h1>Orion</h1>

  <p class="subtitle">
    Moderation tools for your Discord server.
  </p>

  <div class="links">
    <a href="./privacy.html">Privacy Policy</a>
    <a href="./terms.html">Terms of Service</a>
  </div>

  <div class="footer">
    © 2026 Orion
  </div>

</main>

</body>
</html>
