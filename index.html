<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Orion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="./orion-icon.png" type="image/png">

  <style>
    :root {
      --blue: #3158d8;
      --blue-dark: #2447bd;
      --blue-light: #5475e8;

      --background: #f4f7ff;
      --background-light: #eef3ff;

      --white: #ffffff;
      --text: #101828;
      --muted: #667085;

      --border: #d8e1f5;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at top left,
          rgba(49, 88, 216, 0.10),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(84, 117, 232, 0.08),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #f7f9ff 0%,
          #eef3ff 50%,
          #f4f7ff 100%
        );
    }

    .card {
      width: 100%;
      max-width: 560px;

      padding: 52px 42px;

      text-align: center;

      background: var(--white);

      border: 1px solid var(--border);
      border-radius: 22px;

      box-shadow:
        0 18px 45px rgba(39, 67, 130, 0.08);
    }

    .logo {
      display: block;

      width: 88px;
      height: 88px;

      object-fit: contain;

      margin: 0 auto 22px;
    }

    h1 {
      margin: 0 0 8px;

      font-size: 2.25rem;
      font-weight: 750;

      color: var(--text);

      letter-spacing: -0.035em;
    }

    .subtitle {
      margin: 0 0 34px;

      color: var(--muted);

      font-size: 1rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 15px 18px;

      background: #f8faff;

      border: 1px solid var(--border);
      border-radius: 11px;

      color: var(--blue);

      font-size: 1rem;
      font-weight: 650;

      text-decoration: none;

      transition:
        background 0.18s ease,
        border-color 0.18s ease,
        color 0.18s ease,
        transform 0.18s ease;
    }

    .links a::after {
      content: "→";

      font-size: 1rem;
      font-weight: 500;

      transition: transform 0.18s ease;
    }

    .links a:hover {
      background: var(--blue);
      border-color: var(--blue);

      color: var(--white);

      transform: translateY(-1px);
    }

    .links a:hover::after {
      transform: translateX(3px);
    }

    .footer {
      margin-top: 30px;

      color: #98a2b3;

      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 42px 24px;
        border-radius: 18px;
      }

      .logo {
        width: 76px;
        height: 76px;
      }

      h1 {
        font-size: 1.9rem;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <img
      src="./orion-icon.png"
      alt="Orion"
      class="logo"
    >

    <h1>Orion</h1>

    <p class="subtitle">
      Moderation tools for your Discord server.
    </p>

    <div class="links">
      <a href="./documentation.html">
        Documentation
      </a>

      <a href="./privacy.html">
        Privacy Policy
      </a>

      <a href="./terms.html">
        Terms of Service
      </a>
    </div>

    <div class="footer">
      © 2026 Orion
    </div>

  </main>

</body>
</html>
