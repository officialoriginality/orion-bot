<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orion</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="./favicon.ico" type="image/x-icon">

<style>
:root {
  --blue: #3155d9;
  --blue-hover: #2748c5;
  --blue-soft: #eef3ff;
  --blue-border: #d5dff7;

  --background: #f3f6fd;
  --background-top: #edf2ff;

  --white: #ffffff;
  --text: #101828;
  --text-secondary: #52627a;
  --border: #dbe3f2;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    Helvetica, Arial, sans-serif;
  color: var(--text);

  background:
    radial-gradient(
      circle at 50% 0%,
      #e4ebff 0%,
      transparent 42%
    ),
    linear-gradient(
      180deg,
      var(--background-top) 0%,
      var(--background) 100%
    );
}

/* Navigation */

.site-header {
  width: 100%;
  border-bottom: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.92);
}

.navigation {
  width: 100%;
  max-width: 1180px;
  min-height: 70px;
  margin: 0 auto;
  padding: 0 28px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;

  color: var(--text);
  font-size: 1.05rem;
  font-weight: 700;
  text-decoration: none;
}

.brand img {
  width: 32px;
  height: 32px;
  object-fit: contain;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-links a {
  padding: 9px 14px;
  border-radius: 8px;

  color: #40506b;
  font-size: 0.92rem;
  font-weight: 600;
  text-decoration: none;

  transition: 0.2s ease;
}

.nav-links a:hover {
  color: var(--blue);
  background: var(--blue-soft);
}

/* Main */

.page {
  min-height: calc(100vh - 70px);
  display: flex;
  align-items: center;
  justify-content: center;

  padding: 70px 24px;
}

.card {
  width: 100%;
  max-width: 560px;

  padding: 56px 48px;

  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 22px;

  text-align: center;

  box-shadow:
    0 18px 45px rgba(39, 65, 120, 0.08);
}

.logo {
  width: 86px;
  height: 86px;
  margin: 0 auto 24px;

  object-fit: contain;
}

h1 {
  margin: 0 0 10px;

  color: var(--text);
  font-size: 2.25rem;
  font-weight: 750;
  letter-spacing: -0.035em;
}

.subtitle {
  margin: 0 0 34px;

  color: var(--text-secondary);
  font-size: 1rem;
}

/* Buttons */

.links {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.links a {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 14px 17px;

  background: #f7f9ff;
  border: 1px solid var(--blue-border);
  border-radius: 10px;

  color: var(--blue);
  font-size: 0.98rem;
  font-weight: 650;
  text-decoration: none;

  transition:
    background 0.2s ease,
    border-color 0.2s ease,
    transform 0.2s ease;
}

.links a::after {
  content: "→";
  font-size: 1rem;
}

.links a:hover {
  background: var(--blue);
  border-color: var(--blue);
  color: white;
  transform: translateY(-1px);
}

.footer {
  margin-top: 30px;

  color: #8290a8;
  font-size: 0.82rem;
}

@media (max-width: 700px) {
  .navigation {
    min-height: auto;
    padding: 14px 18px;
    flex-direction: column;
    gap: 8px;
  }

  .nav-links {
    flex-wrap: wrap;
    justify-content: center;
  }

  .page {
    padding: 40px 16px;
  }

  .card {
    padding: 42px 24px;
  }

  h1 {
    font-size: 1.9rem;
  }
}
</style>
</head>

<body>

<header class="site-header">
  <nav class="navigation">

    <a class="brand" href="./index.html">
      <img src="./favicon.ico" alt="Orion">
      <span>Orion</span>
    </a>

    <div class="nav-links">
      <a href="./documentation.html">Documentation</a>
      <a href="./privacy.html">Privacy Policy</a>
      <a href="./terms.html">Terms of Service</a>
    </div>

  </nav>
</header>

<main class="page">

  <section class="card">

    <img
      class="logo"
      src="./favicon.ico"
      alt="Orion logo"
    >

    <h1>Orion</h1>

    <p class="subtitle">
      Moderation tools for your Discord server.
    </p>

    <div class="links">
      <a href="./documentation.html">Documentation</a>
      <a href="./privacy.html">Privacy Policy</a>
      <a href="./terms.html">Terms of Service</a>
    </div>

    <div class="footer">
      © 2026 Orion
    </div>

  </section>

</main>

</body>
</html>
